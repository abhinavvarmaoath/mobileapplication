<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-hashes' 'sha256-biLFinpqYMtWHmXfkA1BPeCY0/fNt46SAZ+BBk5YUog=' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' data:; connect-src 'self' https://rubypals.com; frame-src 'none'; base-uri 'self'; form-action 'self'">
		<title>Login</title>
		<link rel="stylesheet" href="themes/Bootstrap.css">
		<link rel="stylesheet" href="vendor/jquery.mobile.structure-1.4.1.min.css" />
		<link rel="stylesheet" href="themes/jquery.mobile.icons.min.css" />
		<link rel="stylesheet" href="css/app.css">
		<script src="vendor/jquery-1.8.2.min.js"></script>
		<script src="vendor/jquery.mobile-1.4.1.min.js"></script>
		<script src="js/config.js"></script>
		<script src="js/index.js"></script>
	</head>
	<body>
		<div data-role="page" data-theme="a">
			<div data-role="content" data-theme="a">

				<a href="signup.html" rel="external" data-role="button" data-icon="user">Signup</a>

				<h2>Login</h2>

				<form id="gr" name="gr">

					<div data-role="fieldcontain">
						<label for="name">Username:</label>
						<input type="text" name="ID" id="ID" value="" autocomplete="username" />
					</div>
					<div data-role="fieldcontain">
						<label for="name">Password:</label>
						<input type="password" name="password" id="password" value="" autocomplete="current-password" />
					</div>

					<div data-role="fieldcontain">
						<label for="slider2" class="account-label">Account Type:</label>
						<select name="slider2" id="flip-c" data-role="slider" class="account-type">
							<option value="student">Student  </option>
							<option value="professor">Professor   </option>
						</select>
					</div>

					<div class="ui-body ui-body-b">
						<fieldset class="ui-grid-a">
							<div class="ui-block-a"><button type="reset" data-theme="e">Cancel</button></div>
							<div class="ui-block-b"><button type="submit" data-theme="f">Login</button></div>
					    </fieldset>
					</div>
				</form>

			</div>
		</div>
	</body>
</html>
