<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Compute my grade</title>

		<link rel="stylesheet" href="themes/Bootstrap.css">
		<link rel="stylesheet" href="vendor/jquery.mobile.structure-1.4.1.min.css" />
		<link rel="stylesheet" href="themes/jquery.mobile.icons.min.css" />
		<link rel="stylesheet" href="css/app.css">
		<script src="vendor/jquery-1.8.2.min.js"></script>
		<script src="vendor/jquery.mobile-1.4.1.min.js"></script>

<script src="js/config.js"></script>
<script src="js/viewGrades.js"></script>
	</head>
	<body>
		<div data-role="page" data-theme="d" style="background-color:#000;">
			<div data-role="header" data-position="inline">
				<h1>Welcome, Student!</h1>
				<div data-role="navbar">
					<ul>
												<li><a href="stuhome.html" rel="external" data-icon="home">Home</a></li>
						<li><a href="team.html" rel="external" data-icon="plus">Group</a></li>
						<li><a href="viewGrades.html" rel="external" data-icon="check" class="ui-btn-active">Grades</a></li>

					</ul>
				</div>
			</div>
			<div data-role="content" data-theme="a" style="background-color:#000;">
			
	<a href="grades.html" rel="external" data-role="button" data-icon="user">View Grades</a>
				<h2  style="color:#fff;"> Estimate Grades</h2>
			     <form name="gr" id="gr">
                                <fieldset>
                                
         <input type="hidden" name="CourseId" style="display: none;" id="CourseId" value="1">
      <input type="hidden" name="StudentId" style="display: none;" id="StudentId" value="1">


                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField" for="sHomeworkField" style="color:#fff;">Homework:<span>(required)</span>
                                        </label>
                                    <input type="range" name="MHomework" id="MHomework" value="60" min="0" max="100" data-highlight="true" data-mini="true"/>
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField" for="sLabsField" style="color:#fff;">Lab:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MLabs" id="MLabs"  value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField" for="sProjectField" style="color:#fff;">Project:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MProject" id="MProject" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField" for="sPresentationField" style="color:#fff;">Presentation:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MPresentation" id="MPresentation" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField" for="sMidtermField" style="color:#fff;">Midterm:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MMidterm" id="MMidterm" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField" for="sFinalField" style="color:#fff;">Final:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MFinal" id="MFinal" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                </fieldset>


						<fieldset class="ui-grid-A">
							<div class="ui-block-a"><button type="submit" data-theme="a" style="margin-left:60%;">COMPUTE GRADE</button></div>
					    </fieldset>
                            </form>
<div class="clear"></div>
                            <label id="totalMarksSaveStatus" style="font:bold  20px; color:#fff; white-space:pre-line;"></label>
                        </div>
				<p>
				</p>

			</div>
	</body>
</html>
