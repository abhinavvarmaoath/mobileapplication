<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-hashes' 'sha256-biLFinpqYMtWHmXfkA1BPeCY0/fNt46SAZ+BBk5YUog=' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' data:; connect-src 'self' https://rubypals.com; frame-src 'none'; base-uri 'self'; form-action 'self'">
		<title>Compute my grade</title>

		<link rel="stylesheet" href="themes/Bootstrap.css">
		<link rel="stylesheet" href="vendor/jquery.mobile.structure-1.4.1.min.css" />
		<link rel="stylesheet" href="themes/jquery.mobile.icons.min.css" />
		<link rel="stylesheet" href="css/app.css">
		<script src="vendor/jquery-1.8.2.min.js"></script>
		<script src="vendor/jquery.mobile-1.4.1.min.js"></script>

<script src="js/config.js"></script>
<script src="js/viewGrades.js"></script>
	</head>
	<body>
		<div data-role="page" data-theme="d" class="dark">
			<div data-role="header" data-position="inline">
				<h1>Welcome, Student!</h1>
				<div data-role="navbar">
					<ul>
												<li><a href="stuhome.html" rel="external" data-icon="home">Home</a></li>
						<li><a href="team.html" rel="external" data-icon="plus">Group</a></li>
						<li><a href="viewGrades.html" rel="external" data-icon="check" class="ui-btn-active">Grades</a></li>

					</ul>
				</div>
			</div>
			<div data-role="content" data-theme="a" class="dark">
			
	<a href="grades.html" rel="external" data-role="button" data-icon="user">View Grades</a>
				<h2 class="light-text"> Estimate Grades</h2>
			     <form name="gr" id="gr">
                                <fieldset>
                                
         <input type="hidden" name="CourseId" id="CourseId" value="1">
      <input type="hidden" name="StudentId" id="StudentId" value="1">


                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField light-text" for="sHomeworkField">Homework:<span>(required)</span>
                                        </label>
                                    <input type="range" name="MHomework" id="MHomework" value="60" min="0" max="100" data-highlight="true" data-mini="true"/>
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField light-text" for="sLabsField">Lab:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MLabs" id="MLabs"  value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField light-text" for="sProjectField">Project:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MProject" id="MProject" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField light-text" for="sPresentationField">Presentation:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MPresentation" id="MPresentation" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField light-text" for="sMidtermField">Midterm:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MMidterm" id="MMidterm" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                    <div class="fieldcontain">
                                        <label class="field-title gradeTextField light-text" for="sFinalField">Final:<span>(required)</span>
                                        </label>
                                        <input type="range" name="MFinal" id="MFinal" value="60" min="0" max="100" data-highlight="true" data-mini="true">
                                    </div>

                                </fieldset>


						<fieldset class="ui-grid-A">
							<div class="ui-block-a"><button type="submit" data-theme="a" class="submit-offset">COMPUTE GRADE</button></div>
					    </fieldset>
                            </form>
<div class="clear"></div>
                            <label id="totalMarksSaveStatus" class="light-text preserve-lines"></label>
                        </div>
				<p>
				</p>

			</div>
	</body>
</html>
